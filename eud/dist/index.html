<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LPU5 EUD">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>LPU5 EUD</title>
  <script type="module" crossorigin src="./assets/index-DCLN7yt3.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BrAmP11T.css">
</head>
<body>
  <!-- Login -->
  <div id="login" class="screen hidden">
    <form id="login-form" class="login-box" autocomplete="on">
      <img src="icon-192.png" alt="" class="login-logo">
      <h1>LPU5 TACTICAL</h1>
      <p class="muted">End User Device</p>
      <label>Server
        <input id="login-server" name="server" placeholder="https://192.168.8.10:8101" inputmode="url" autocapitalize="off" required>
      </label>
      <label>Benutzer
        <input id="login-user" name="username" autocomplete="username" autocapitalize="off" required>
      </label>
      <label>Passwort
        <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn primary" id="login-submit">Anmelden</button>
      <button type="button" class="btn" id="login-offline">Offline fortfahren</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <!-- Forced password change -->
  <div id="pw-dialog" class="screen hidden" style="z-index:3600">
    <form id="pw-form" class="login-box">
      <h1 style="font-size:17px">PASSWORT ÄNDERN</h1>
      <p class="muted">Bitte ein eigenes Passwort festlegen (mindestens 8 Zeichen).</p>
      <label>Bisheriges Passwort<input id="pw-old" type="password" autocomplete="current-password"></label>
      <label>Neues Passwort<input id="pw-new" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Wiederholen<input id="pw-new2" type="password" autocomplete="new-password" minlength="8" required></label>
      <button class="btn primary">Speichern</button>
      <p id="pw-error" class="error"></p>
    </form>
  </div>

  <!-- Certificate confirmation -->
  <div id="trust-dialog" class="screen hidden" style="z-index:3500">
    <div class="login-box">
      <h1 id="trust-title" style="font-size:17px;letter-spacing:.04em"></h1>
      <p id="trust-text" class="muted" style="text-align:left"></p>
      <code id="trust-fp" class="fingerprint"></code>
      <button type="button" class="btn primary" id="trust-ok">Vertrauen &amp; verbinden</button>
      <button type="button" class="btn" id="trust-cancel">Abbrechen</button>
    </div>
  </div>

  <!-- Top status bar (layout of the LPU5 field view, made for landscape use) -->
  <header id="top-status-bar">
    <span id="tsb-clock">00:00</span>
    <div class="tsb-sep"></div>
    <div class="tsb-info" id="tsb-battery" title="Akku"><i class="fas fa-battery-full"></i><span id="tsb-battery-level">–</span></div>
    <div class="tsb-sep"></div>
    <div class="tsb-info"><span id="sb-link" class="link offline" title="Verbindung">OFFLINE</span></div>
    <div class="tsb-info"><i class="fas fa-satellite"></i><span id="sb-gps" title="GPS">–</span></div>
    <div class="tsb-sep"></div>
    <div id="tsb-user-block">
      <span id="sb-callsign">EUD</span>
      <span id="sb-mesh" class="tsb-tag mesh hidden" title="Meshtastic">MESH</span>
      <span id="sb-outbox" class="tsb-tag warn hidden" title="Ausstehende Meldungen">⇪ 0</span>
      <span id="sb-nav" class="tsb-tag nav hidden"></span>
    </div>
    <div class="tsb-sep"></div>
    <div class="tsb-break"></div>
    <div id="tsb-zoom-control">
      <button class="tsb-zoom-btn" data-action="zoom-out" title="Zoom −">−</button>
      <button class="tsb-zoom-btn" data-action="zoom-in" title="Zoom +">+</button>
    </div>
    <div class="tsb-sep"></div>
    <div class="tsb-actions">
      <button class="tsb-btn tsb-sos" data-action="sos" title="Notruf / Alarm">SOS</button>
      <button class="tsb-btn" data-action="add" title="Marker am Fadenkreuz setzen"><i class="fas fa-location-crosshairs" style="color:#ffd24d"></i></button>
      <button class="tsb-btn" data-action="chat" title="Chat"><i class="fas fa-comment" style="color:#2ecc71"></i><span id="chat-badge" class="badge hidden">0</span></button>
      <button class="tsb-btn" data-action="video" title="Video / Kamera"><i class="fas fa-video" style="color:#3b9dff"></i></button>
      <button class="tsb-btn" data-action="sync" title="Synchronisieren"><i class="fas fa-rotate" style="color:#5dade2"></i></button>
      <button class="tsb-btn" data-action="menu" title="Menü"><i class="fas fa-bars"></i><span id="mesh-dot" class="badge mesh hidden">●</span></button>
    </div>
  </header>

  <div id="map"></div>
  <div id="crosshair" class="hidden">+</div>

  <!-- Floating compass (top left) – tap: compass on/off -->
  <button id="tsb-compass" data-action="north" title="Kompass ein/aus">
    <svg viewBox="0 0 28 28" fill="none">
      <circle cx="14" cy="14" r="13" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
      <line x1="14" y1="2" x2="14" y2="5.5" stroke="rgba(255,255,255,0.7)" stroke-width="1.2"/>
      <line x1="26" y1="14" x2="22.5" y2="14" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>
      <line x1="14" y1="26" x2="14" y2="22.5" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>
      <line x1="2" y1="14" x2="5.5" y2="14" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>
      <g id="compass-needle-group">
        <polygon points="14,3 12.6,14 15.4,14" fill="#ff3333"/>
        <polygon points="14,25 12.6,14 15.4,14" fill="rgba(200,200,200,0.45)"/>
        <circle cx="14" cy="14" r="1.8" fill="#fff" stroke="rgba(0,0,0,0.4)" stroke-width="0.5"/>
      </g>
    </svg>
    <span id="tsb-compass-bearing">000°</span>
  </button>

  <!-- Map quick buttons (bottom right) -->
  <div id="map-quick">
    <button class="tsb-btn" data-action="measure" title="Messen"><i class="fas fa-ruler"></i></button>
    <button class="tsb-btn" data-action="locate" title="Eigener Standort / Folgen"><i class="fas fa-location-arrow"></i></button>
  </div>

  <!-- Coordinate readout -->
  <footer id="coords">
    <span id="coord-self" title="Eigener Standort">–</span>
    <span id="coord-center" title="Kartenmitte">–</span>
  </footer>

  <!-- Command menu (tiles), opened with ☰ -->
  <div id="status-menu">
    <div id="sidebar-overlay" data-action="menu-close"></div>
    <div id="sidebar-panel">
      <div class="sidebar-header"><span>COMMAND MENU</span><button class="sidebar-close-btn" data-action="menu-close"><i class="fas fa-times"></i></button></div>
      <div class="sidebar-tile-grid" id="sidebar-tile-grid">
        <div class="sidebar-nav-divider">Lage</div>
        <button class="sidebar-tile" data-action="add"><i class="fas fa-location-crosshairs"></i><span>Marker</span></button>
        <button class="sidebar-tile" data-action="draw"><i class="fas fa-pen-ruler"></i><span>Zeichnen</span></button>
        <button class="sidebar-tile" data-action="report"><i class="fas fa-file-medical"></i><span>Meldung</span></button>
        <button class="sidebar-tile" data-action="contacts"><i class="fas fa-address-book"></i><span>Kontakte</span></button>
        <button class="sidebar-tile" data-action="measure"><i class="fas fa-ruler"></i><span>Messen</span></button>
        <button class="sidebar-tile" data-action="sos"><i class="fas fa-triangle-exclamation" style="color:#ff4d4d"></i><span>Notruf</span></button>
        <div class="sidebar-nav-divider">Karte</div>
        <button class="sidebar-tile" data-action="layers"><i class="fas fa-layer-group"></i><span>Karten &amp; Overlays</span></button>
        <button class="sidebar-tile" data-action="offline"><i class="fas fa-download"></i><span>Offline-Karten</span></button>
        <button class="sidebar-tile" data-action="night"><i class="fas fa-moon"></i><span>Nacht</span></button>
        <div class="sidebar-nav-divider">Verbindung</div>
        <button class="sidebar-tile" data-action="chat"><i class="fas fa-comments"></i><span>Chat</span></button>
        <button class="sidebar-tile" data-action="mesh"><i class="fab fa-bluetooth-b"></i><span>Mesh</span></button>
        <button class="sidebar-tile" data-action="video"><i class="fas fa-video"></i><span>Video</span></button>
        <button class="sidebar-tile" data-action="packages"><i class="fas fa-box-archive"></i><span>Pakete</span></button>
        <button class="sidebar-tile" data-action="sync"><i class="fas fa-rotate"></i><span>Sync</span></button>
        <button class="sidebar-tile" data-action="settings"><i class="fas fa-gear"></i><span>Einstell.</span></button>
        <button class="sidebar-tile hidden" id="tile-hq" data-action="hq"><i class="fas fa-desktop"></i><span>Hauptansicht</span></button>
      </div>
    </div>
  </div>

  <!-- Measure readout -->
  <div id="measure-bar" class="hidden">
    <span id="measure-text">Punkte auf die Karte tippen</span>
    <button class="btn small" id="measure-undo">↶</button>
    <button class="btn small" id="measure-done">Fertig</button>
  </div>

  <!-- Bottom sheet -->
  <section id="sheet" class="hidden" aria-live="polite">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button id="sheet-close" class="btn small" aria-label="Schließen">✕</button>
    </div>
    <div id="sheet-body"></div>
  </section>

  <div id="toast" class="hidden"></div>
  <input type="file" id="file-input" class="hidden" accept=".kml,.kmz,.gpx,.geojson,.json,.mbtiles">

</body>
</html>
