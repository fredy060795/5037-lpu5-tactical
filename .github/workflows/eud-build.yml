name: EUD apps (Android APK, iOS, PWA)

on:
  push:
    branches: [main, master, 'claude/**']
    tags: ['v*']
    paths:
      - 'eud/**'
      - 'video_analytics.py'
      - 'test_video_analytics.py'
      - 'radio_transcribe.py'
      - 'test_radio_transcribe.py'
      - 'tak_integration.py'
      - 'security.py'
      - 'tile_server.py'
      - 'tsl_bridge.py'
      - 'test_tile_server.py'
      - 'test_security.py'
      - 'test_tak_integration.py'
      - 'api.py'
      - '.github/workflows/eud-build.yml'
  pull_request:
    paths:
      - 'eud/**'
      - 'video_analytics.py'
      - 'radio_transcribe.py'
      - '.github/workflows/eud-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Web build + tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: eud } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: eud/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: lpu5-eud-pwa, path: eud/dist }

  server-tests:
    name: Video analytics tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install fastapi httpx pytest opencv-python-headless numpy python-multipart cryptography requests pillow
      - run: pip install scipy
      - run: python -m pytest -q test_video_analytics.py test_radio_transcribe.py test_tak_integration.py test_security.py test_tile_server.py test_tsl_bridge.py

  radio-whisper:
    name: Funk-Mitschrift (Whisper, echte Spracherkennung)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: pip install fastapi httpx pytest numpy scipy faster-whisper python-multipart
      - name: Testfunkspruch erzeugen (Sprachsynthese)
        run: espeak-ng -v de -s 135 -w "$RUNNER_TEMP/funk.wav" "Hier Alpha eins. Kontakt Nord, drei Fahrzeuge. Kommen."
      - name: Whisper-Mitschrift prüfen
        env:
          RADIO_WHISPER_TEST_WAV: ${{ runner.temp }}/funk.wav
          RADIO_WHISPER_MODEL: base
        run: python -m pytest -q -s test_radio_transcribe.py

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: web
    defaults: { run: { working-directory: eud } }
    env:
      LPU5_VERSION_CODE: ${{ github.run_number }}
      LPU5_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('2.0.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: eud/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      # The Android SDK is preinstalled on ubuntu-latest (ANDROID_HOME); Gradle
      # fetches missing platform/build-tools packages itself.
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Decode release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.LPU5_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LPU5_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No LPU5_KEYSTORE_BASE64 secret – release APK is signed with the debug key."
          fi
      - name: Gradle build
        working-directory: eud/android
        env:
          LPU5_KEYSTORE_PASSWORD: ${{ secrets.LPU5_KEYSTORE_PASSWORD }}
          LPU5_KEY_ALIAS: ${{ secrets.LPU5_KEY_ALIAS }}
          LPU5_KEY_PASSWORD: ${{ secrets.LPU5_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease
          mkdir -p ../../out
          cp app/build/outputs/apk/debug/app-debug.apk ../../out/LPU5-EUD-debug.apk
          cp app/build/outputs/apk/release/app-release.apk ../../out/LPU5-EUD.apk
      - uses: actions/upload-artifact@v4
        with: { name: lpu5-eud-android, path: out/*.apk }
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: out/LPU5-EUD.apk }

  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-15
    needs: web
    defaults: { run: { working-directory: eud } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: eud/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build archive without signing
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry LPU5-EUD-unsigned.ipa Payload)
          mkdir -p ../out && cp "$RUNNER_TEMP/ipa/LPU5-EUD-unsigned.ipa" ../out/
      - uses: actions/upload-artifact@v4
        with: { name: lpu5-eud-ios-unsigned, path: out/*.ipa }
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: out/LPU5-EUD-unsigned.ipa }
