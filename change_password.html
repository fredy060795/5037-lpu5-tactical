<!doctype html>
<html lang="de">
<head>
  <script src="/auth-fetch.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LPU5 – Passwort ändern</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
      background: radial-gradient(circle at 50% 20%, #15241a, #050806 70%); color: #e6efe8; font: 15px/1.4 system-ui, sans-serif; }
    form { width: 100%; max-width: 380px; background: rgba(16,22,18,.95); border: 1px solid #2b3a2f; border-radius: 14px; padding: 24px; }
    h1 { font-size: 19px; margin: 0 0 6px; letter-spacing: .06em; }
    p { color: #8ea395; margin: 0 0 14px; font-size: 13px; }
    label { display: block; font-size: 12px; color: #8ea395; margin: 10px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 10px; background: #0b100d; border: 1px solid #2b3a2f; border-radius: 8px; color: inherit; font: inherit; }
    button { width: 100%; margin-top: 16px; padding: 11px; border-radius: 8px; border: 1px solid #2f9e55; background: #1f6b38; color: #fff; font-weight: 600; font: inherit; cursor: pointer; }
    .err { color: #ff6b6b; min-height: 1.2em; margin-top: 10px; font-size: 13px; }
    .ok { color: #6fdc8c; }
  </style>
</head>
<body>
  <form id="f">
    <h1>PASSWORT ÄNDERN</h1>
    <p>Dieses Konto nutzt noch ein Standard- oder vom Administrator vergebenes Passwort. Bitte ein eigenes Passwort festlegen (mindestens 8 Zeichen).</p>
    <label>Benutzer<input id="u" autocomplete="username" required></label>
    <label>Bisheriges Passwort<input id="o" type="password" autocomplete="current-password" required></label>
    <label>Neues Passwort<input id="n" type="password" autocomplete="new-password" minlength="8" required></label>
    <label>Neues Passwort wiederholen<input id="n2" type="password" autocomplete="new-password" minlength="8" required></label>
    <button>Speichern</button>
    <div class="err" id="e"></div>
  </form>
  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      try { var u = JSON.parse(localStorage.getItem('user') || 'null'); if (u && u.username) $('u').value = u.username; } catch (e) {}
      $('f').onsubmit = function (ev) {
        ev.preventDefault();
        $('e').className = 'err'; $('e').textContent = '';
        if ($('n').value !== $('n2').value) { $('e').textContent = 'Die neuen Passwörter stimmen nicht überein'; return; }
        fetch('/api/change_password', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: $('u').value.trim(), old_password: $('o').value, new_password: $('n').value }) })
          .then(function (r) { return r.json().then(function (b) { if (!r.ok) throw new Error(b.detail || b.message || r.status); }); })
          .then(function () {
            $('e').className = 'err ok'; $('e').textContent = 'Passwort geändert – weiter …';
            var next = new URLSearchParams(location.search).get('next') || '/index.html';
            if (!/^\/[^\/]/.test(next)) next = '/index.html';
            setTimeout(function () { location.href = next; }, 800);
          })
          .catch(function (err) { $('e').textContent = err.message; });
      };
    })();
  </script>
</body>
</html>
